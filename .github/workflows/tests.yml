name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: [8.4, 8.5]
        laravel: ['^13.0']
        include:
          - laravel: '^13.0'
            testbench: '^11.0'

    name: PHP ${{ matrix.php-version }} - Laravel ${{ matrix.laravel }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
        coverage: none
        tools: composer:2.9.8

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-laravel-${{ matrix.laravel }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-laravel-${{ matrix.laravel }}-
      

    - name: Install dependencies
      run: |
        composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-update
        composer update --prefer-dist --no-progress

    - name: Audit dependencies
      run: composer audit --no-interaction

    - name: Run tests
      run: composer test

    - name: Run code formatting check
      run: composer pint:test

    - name: Run static analysis
      run: composer analyse

    - name: Run Rector (dry run)
      run: composer dry